name: Label merge conflicts

on:
  # A push to main can make other open pull requests conflict.
  # On a push, the action only checks pull requests that target that branch.
  push:
    branches:
      - main
  # A new push on a pull request can create or resolve conflicts.
  # pull_request_target keeps write access for fork pull requests.
  # This workflow does not check out pull request code.
  pull_request_target:
    types: [synchronize]
  workflow_dispatch:

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label conflicting pull requests
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "PR: needs rebase"
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          commentOnDirty: "This pull request has conflicts with main. Update the branch and resolve them before it can be merged."
          commentOnClean: "The conflicts are resolved."
