<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker — Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Konsept: taktik HUD. Keskin köşe, düz renk, kalın çizgi, condensed büyük harf. */
  :root {
    --bg: #09090b;
    --rail: #0e0e11;
    --surface: #121215;
    --surface-2: #19191d;
    --surface-3: #232328;
    --line: #26262c;
    --line-strong: #3a3a42;
    --text: #f4f0e8;
    --muted: #96918a;
    --faint: #5f5b55;
    --accent: #ff4655;
    --accent-dim: #2a1216;
    --ok: #3ddc8c;
    --warn: #f5b942;
    --info: #5fa2ff;
    --violet: #b98cff;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --notch: 10px;
  }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border: 3px solid var(--bg); }
  ::-webkit-scrollbar-track { background: var(--bg); }
  svg.ic { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }

  /* ---------- giriş ---------- */
  .login-screen { min-height: 100%; display: grid; grid-template-columns: 1.15fr 0.85fr; }
  .login-brand {
    padding: 56px;
    display: flex; flex-direction: column; justify-content: space-between;
    background:
      repeating-linear-gradient(135deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 23px),
      var(--rail);
    border-right: 4px solid var(--accent);
  }
  .mark { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 700; letter-spacing: 0.2em; font-size: 18px; text-transform: uppercase; }
  .mark i { width: 16px; height: 16px; display: block; background: var(--accent); transform: rotate(45deg); }
  .login-brand h1 { margin: 0; font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 64px; line-height: 0.92; letter-spacing: -0.005em; max-width: 9ch; }
  .login-brand p { color: var(--muted); max-width: 40ch; margin: 22px 0 0; font-size: 17px; }
  .login-panel { display: flex; align-items: center; justify-content: center; padding: 32px; }
  .login-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line-strong); border-top: 4px solid var(--accent); padding: 32px; }
  .login-card h2 { margin: 0 0 6px; font-family: var(--display); font-size: 30px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.02em; }
  .field { display: flex; flex-direction: column; gap: 7px; margin-top: 18px; }
  .field span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
  input, select {
    background: var(--bg);
    border: 1px solid var(--line-strong);
    padding: 11px 13px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); background: #0c0c0f; }
  input::placeholder { color: var(--faint); }
  select { cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 9px 16px;
    font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
  }
  .btn:hover { background: #ff5f6c; }
  .btn:active { background: #e03545; }
  .btn.ghost { background: var(--line-strong); color: var(--text); }
  .btn.ghost:hover { background: #4a4a54; }
  .btn.small { padding: 6px 14px; font-size: 13px; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .err { color: var(--accent); min-height: 1.2em; margin-top: 12px; font-size: 14px; }
  .login-card .btn { width: 100%; margin-top: 24px; padding: 14px; font-size: 18px; }

  /* ---------- kabuk ---------- */
  .app { display: none; min-height: 100%; }
  .app.on { display: grid; grid-template-columns: 208px 1fr; }
  .rail {
    background: var(--rail);
    border-right: 1px solid var(--line-strong);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    padding: 0 0 18px;
  }
  .rail .mark { padding: 16px 18px; border-bottom: 1px solid var(--line-strong); font-size: 16px; }
  .nav { display: flex; flex-direction: column; margin-top: 12px; }
  .nav-label { padding: 0 18px 6px; font-family: var(--display); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .nav button {
    display: flex; align-items: center; gap: 11px;
    text-align: left; background: transparent; border: 0;
    border-left: 4px solid transparent;
    color: var(--muted);
    padding: 9px 16px 9px 14px;
    width: 100%;
    font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .nav button .nav-text { flex: 1; }
  .nav-count {
    min-width: 22px; padding: 0 6px; font-size: 12px; font-family: "IBM Plex Mono", monospace; font-weight: 500; line-height: 18px; text-align: center;
    background: var(--info); color: #06101f; letter-spacing: 0;
  }
  .nav-count[hidden] { display: none; }
  .nav button:hover { color: var(--text); background: var(--surface); }
  .nav button.active { color: #fff; background: var(--accent-dim); border-left-color: var(--accent); }
  .nav button.active .ic { color: var(--accent); }
  .rail-foot { margin-top: auto; margin: auto 10px 0; padding: 10px; color: var(--muted); font-size: 13px; border: 1px solid var(--line-strong); background: var(--surface); }
  .rail-foot .who { color: var(--text); margin-bottom: 12px; word-break: break-all; font-size: 13px; }
  .rail-foot .btn { width: 100%; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .top {
    display: flex; align-items: center; gap: 14px;
    padding: 0 24px; height: 50px;
    border-bottom: 1px solid var(--line-strong);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  .menu-btn { display: none; }
  .crumb { font-family: var(--display); font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .crumb strong { color: var(--text); font-weight: 700; }
  .crumb strong::before { content: "// "; color: var(--accent); }
  .top-spacer { flex: 1; }
  .live-pill {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
    padding: 0 12px; height: 32px; border: 1px solid var(--line-strong); background: var(--surface);
  }
  .live-pill i { width: 10px; height: 10px; background: var(--faint); display: block; }
  .live-pill.on i { background: var(--ok); animation: blink 1.6s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .live-pill .when { color: var(--faint); font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0; }
  .search-wrap { position: relative; width: min(280px, 32vw); }
  .search-wrap .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; width: 18px; height: 18px; }
  .search { width: 100%; height: 32px; background: var(--surface); padding: 0 10px 0 36px; font-size: 13px; }

  .page { padding: 22px 24px 36px; display: flex; flex-direction: column; gap: 14px; max-width: 1760px; width: 100%; margin: 0 auto; }
  .page-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; padding-bottom: 12px; border-bottom: 3px solid var(--accent); position: relative; }
  .page-head::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 100%; height: 4px; background: repeating-linear-gradient(90deg, var(--bg) 0 3px, transparent 3px 6px); opacity: 0; }
  .page-head h1 { margin: 0; font-family: var(--display); font-size: 40px; letter-spacing: 0; font-weight: 700; line-height: 0.9; text-transform: uppercase; }
  .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 90ch; }

  /* ---------- istatistik kartları ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-left: 5px solid var(--tone, var(--accent));
    padding: 12px 16px 12px;
    clip-path: polygon(0 0, calc(100% - var(--notch)) 0, 100% var(--notch), 100% 100%, 0 100%);
  }
  .stat .top-row { display: flex; align-items: center; justify-content: space-between; }
  .stat .k { color: var(--muted); font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .stat .ico { color: var(--tone, var(--accent)); margin-right: 8px; display: flex; }
  .stat .ico .ic { width: 18px; height: 18px; }
  .stat .v { font-family: var(--display); font-size: 52px; font-weight: 700; margin-top: 0; line-height: 1; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .stat .v small { font-family: "IBM Plex Sans", sans-serif; font-size: 12px; color: var(--tone, var(--muted)); font-weight: 600; margin-left: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
  .stat .s { color: var(--faint); font-size: 11px; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }

  .grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; align-items: stretch; }
  .panel { background: var(--surface); border: 1px solid var(--line-strong); min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel h2 {
    margin: 0; padding: 0 14px; height: 38px;
    font-family: var(--display); font-size: 16px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line-strong);
    border-left: 5px solid var(--accent);
    display: flex; align-items: center; gap: 10px;
  }
  .panel h2 .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--bg); background: var(--muted); padding: 0 6px; }
  .panel h2 a.sub { margin-left: auto; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--accent); }
  .panel h2 a.sub:hover { color: #fff; }
  .panel .body { padding: 14px 16px 16px; flex: 1; }

  /* saatlik grafik */
  .hour-wrap { position: relative; padding-left: 28px; }
  .hour-y { position: absolute; left: 0; top: 0; height: 150px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--faint); font-family: "IBM Plex Mono", monospace; }
  .hour-grid { position: absolute; left: 28px; right: 0; top: 0; height: 150px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
  .hour-grid i { display: block; border-top: 1px solid var(--line); }
  .hour { position: relative; display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 150px; }
  .hour span { display: block; min-height: 3px; background: var(--accent); }
  .hour span:hover { background: #fff; }
  .hour span.now { background: var(--warn); }
  .hour span.zero { background: var(--surface-3); }
  .hour-labels { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; color: var(--faint); font-size: 10px; margin-top: 6px; font-family: "IBM Plex Mono", monospace; text-align: center; }

  /* yatay çubuklar */
  .ver-row { display: grid; grid-template-columns: 112px 1fr 40px; gap: 10px; align-items: center; padding: 5px 0; }
  .ver-row b { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .ver-row b.mono { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .ver-row .n { text-align: right; font-family: var(--display); font-size: 18px; font-weight: 700; }
  .ver-row .dot { width: 8px; height: 8px; background: var(--c, var(--accent)); flex: none; }
  .track { height: 11px; background: var(--surface-3); position: relative; }
  .track i { display: block; height: 100%; background: var(--c, var(--accent)); }
  .track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 8px, var(--surface) 8px 10px); pointer-events: none; }

  /* araç çubuğu */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { background: var(--surface); padding: 8px 12px; font-size: 13px; }
  .toolbar .grow { flex: 1; min-width: 220px; }

  /* tablolar */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  th {
    color: var(--muted); font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; user-select: none; white-space: nowrap;
    background: var(--bg); border-bottom: 2px solid var(--line-strong);
  }
  th:hover { color: var(--text); }
  th.nosort { cursor: default; }
  th.nosort:hover { color: var(--muted); }
  th.sorted { color: var(--accent); }
  tr.clickable { cursor: pointer; }
  tr.clickable td:first-child { box-shadow: inset 4px 0 0 transparent; }
  tr.clickable:hover td { background: var(--surface-2); }
  tr.clickable:hover td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
  .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .person { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 26px; height: 26px; flex: none;
    display: grid; place-items: center;
    font-family: var(--display); font-size: 16px; font-weight: 700; text-transform: uppercase;
    color: hsl(var(--h) 80% 68%);
    background: hsl(var(--h) 40% 14%);
    border: 1px solid hsl(var(--h) 45% 30%);
    border-left: 3px solid hsl(var(--h) 80% 60%);
  }
  .avatar.lg { width: 44px; height: 44px; font-size: 26px; }
  .person .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .tg { color: var(--faint); font-weight: 400; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 9px 0 8px;
    background: color-mix(in srgb, var(--c, var(--muted)) 16%, var(--bg));
    border-left: 4px solid var(--c, var(--muted));
    font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--c, var(--muted));
    white-space: nowrap; line-height: 1.5;
  }
  .pill::before { display: none; }
  .pill.ingame { --c: var(--ok); }
  .pill.pregame { --c: var(--warn); }
  .pill.queue { --c: var(--info); }
  .pill.custom { --c: var(--violet); }
  .pill.idle { --c: #b9b3aa; }
  .pill.paused { --c: #8d877e; }
  .pill.offline, .pill.closed { --c: #6a655e; }
  .chip { display: inline-block; padding: 0 6px; background: var(--surface-3); font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text); }
  .score { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; }
  .score .w { color: var(--ok); } .score .l { color: var(--accent); }

  .pager { display: flex; align-items: center; gap: 12px; padding: 8px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line-strong); background: var(--bg); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .pager .spacer { flex: 1; }
  .empty, .loading { padding: 28px 16px; color: var(--muted); text-align: center; font-family: var(--display); font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; }
  .skel { height: 14px; background: var(--surface-2); margin: 12px 0; }

  /* çekmece */
  .drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 5; }
  .drawer-back.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%);
    background: var(--rail); border-left: 4px solid var(--accent); z-index: 6;
    transform: translateX(100%); transition: transform 0.14s ease-out; overflow: auto;
  }
  .drawer.on { transform: none; }
  .drawer header { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line-strong); background: var(--surface-2); }
  .drawer .who-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .drawer h3 { margin: 0; font-family: var(--display); font-size: 24px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; }
  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 10px; padding: 18px 20px; font-size: 13px; }
  .kv > span { color: var(--muted); font-family: var(--display); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .kv > div { min-width: 0; word-break: break-all; }
  .copy { background: var(--line-strong); border: 0; color: var(--text); padding: 3px 10px; font-family: var(--display); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px; }
  .copy:hover { background: var(--accent); }
  .badge-live { display: inline-block; margin-left: 10px; padding: 0 8px; font-family: var(--display); font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #04140b; background: var(--ok); vertical-align: 1px; }
  .notice { border: 1px solid var(--accent); border-left: 6px solid var(--accent); background: var(--accent-dim); padding: 13px 16px; font-size: 14px; }
  .busy { opacity: 0.55; transition: opacity 0.15s; }
  .table-wrap { overflow-x: auto; }
  .sub { color: var(--faint); font-size: 13px; }

  @media (max-width: 1280px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 980px) {
    .login-screen { grid-template-columns: 1fr; }
    .login-brand { display: none; }
  }
  @media (max-width: 760px) {
    .app.on { grid-template-columns: 1fr; }
    .rail { position: fixed; z-index: 7; transform: translateX(-105%); transition: transform 0.14s ease-out; width: 270px; }
    .rail.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .search-wrap { display: none; }
    .page { padding: 18px; }
    .top { padding: 0 18px; }
    .page-head h1 { font-size: 34px; }
    .stat .v { font-size: 44px; }
    .ver-row { grid-template-columns: 100px 1fr 44px; }
    .hour-labels span:nth-child(even) { visibility: hidden; }
  }
</style>
</head>
<body>
<div id="config-error" class="login-panel" style="display:none">
  <div class="login-card">
    <h2>Yapılandırma eksik</h2>
    <p class="muted">config.js içinde Supabase adresi ve anon anahtar olmalı.</p>
  </div>
</div>

<div id="login-screen" class="login-screen" style="display:none">
  <div class="login-brand">
    <div class="mark"><i></i> VALORANT TRACKER</div>
    <div>
      <h1>Kim açık, kim hangi sürümde.</h1>
      <p>Kurulumlar, oturumlar ve lobideki overlay kullanıcıları. Saatler İstanbul.</p>
    </div>
    <div class="muted">Yönetici girişi</div>
  </div>
  <div class="login-panel">
    <form id="signin" class="login-card">
      <h2>Giriş</h2>
      <p class="muted">Bu ekran sadece sana açık.</p>
      <label class="field"><span>E-posta</span><input id="email" type="email" required autocomplete="username"></label>
      <label class="field"><span>Şifre</span><input id="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" id="signin-btn">Giriş yap</button>
      <div id="login-error" class="err"></div>
    </form>
  </div>
</div>

<div id="app" class="app">
  <aside class="rail" id="rail">
    <div class="mark"><i></i> TRACKER</div>
    <nav class="nav" id="nav">
      <div class="nav-label">Menü</div>
      <button data-route="overview"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="nav-text">Genel bakış</span></button>
      <button data-route="live"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="nav-text">Canlı</span></button>
      <button data-route="queue"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-text">Sırada</span><span class="nav-count" id="queue-count" hidden>0</span></button>
      <button data-route="users"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.6"/></svg><span class="nav-text">Kullanıcılar</span></button>
      <button data-route="sessions"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="nav-text">Oturumlar</span></button>
    </nav>
    <div class="rail-foot">
      <div class="who" id="who"></div>
      <button class="btn ghost small" id="signout" type="button">Çıkış</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn ghost small menu-btn" id="menu" type="button">Menü</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-spacer"></div>
      <div class="live-pill" id="live-pill"><i></i><span class="what">—</span><span class="when"></span></div>
      <div class="search-wrap"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="global-search" placeholder="İsim veya PUUID, Enter" autocomplete="off"></div>
      <button class="btn ghost small" id="refresh" type="button">Yenile</button>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>
<div class="drawer-back" id="drawer-back"></div>
<aside class="drawer" id="drawer"></aside>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------
  // Ücretsiz kota: Realtime yok. Tüm sayımlar sunucuda (admin_* RPC).
  // Genel bakış ve Canlı, sekme görünürken 30 sn'de bir yenilenir.
  // Sırada sekmesi görünürken 5 sn. Kullanıcılar / Oturumlar elle.
  // Overlay sıraya girince kaydı hemen yazar ve sırada kaldıkça 15 sn'de
  // bir yeniler. Sırada sayılmak için son sinyal 45 sn'den yeni olmalı;
  // maç çoğu zaman ~20 sn'de bulunur.
  // ------------------------------------------------------------------

  var cfg = window.TELEMETRY_CONFIG;
  if (!cfg || !cfg.url || !cfg.anonKey || cfg.url.indexOf("YOUR_PROJECT") !== -1 || cfg.anonKey.indexOf("YOUR_ANON_KEY") !== -1) {
    document.getElementById("config-error").style.display = "block";
    return;
  }

  var sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  var PAGE = 25;

  var ROUTES = {
    overview: { title: "Genel bakış", poll: 30000 },
    live: { title: "Canlı", poll: 30000 },
    queue: { title: "Sırada", poll: 5000 },
    users: { title: "Kullanıcılar", poll: 0, sorts: ["riot_name", "app_version", "first_seen", "last_seen"], sort: "last_seen" },
    sessions: { title: "Oturumlar", poll: 0, sorts: ["started_at", "duration"], sort: "started_at" }
  };
  var PHASES = ["ingame", "pregame", "queue", "custom", "idle", "paused", "offline"];

  var state = {
    route: null,
    q: "",
    page: 1,
    sort: "",
    asc: false,
    phase: "",
    version: "",
    versions: null,
    seq: 0,
    timer: null,
    loadedAt: 0,
    user: null
  };

  // ---------------- yardımcılar ----------------

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // UTF-8'in Windows-1252 diye okunmasıyla bozulmuş Türkçe harfleri onarır
  // (eski kayıtlar için; sunucu yeni kayıtları zaten düzeltiyor).
  var MOJIBAKE = [["Ã§","ç"],["Ã‡","Ç"],["ÄŸ","ğ"],["Äž","Ğ"],["Ä±","ı"],["Ä°","İ"],["Ã¶","ö"],["Ã–","Ö"],["ÅŸ","ş"],["Åž","Ş"],["Ã¼","ü"],["Ãœ","Ü"]];
  function fixText(s) {
    if (s == null) return s;
    s = String(s);
    if (!/[ÃÄÅ]/.test(s)) return s;
    MOJIBAKE.forEach(function (p) { s = s.split(p[0]).join(p[1]); });
    return s;
  }
  // supabase.tl_live_phase ile aynı pencere. 1 dk'lık sinyal artık sıra değil.
  var QUEUE_FRESH_MS = 45000;
  function queueFresh(iso) {
    var t = new Date(iso).getTime();
    return !isNaN(t) && Date.now() - t < QUEUE_FRESH_MS;
  }
  function ago(iso) {
    if (!iso) return "—";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "—";
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return s + " sn önce";
    if (s < 3600) return Math.floor(s / 60) + " dk önce";
    if (s < 86400) return Math.floor(s / 3600) + " sa önce";
    return Math.floor(s / 86400) + " gün önce";
  }
  function fmt(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleString("tr-TR", {
      timeZone: "Europe/Istanbul",
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
    });
  }
  function clock() {
    return new Date().toLocaleTimeString("tr-TR", { timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  function dur(sec) {
    if (sec == null) return "—";
    var m = Math.max(0, Math.round(sec / 60));
    if (m < 1) return "<1 dk";
    if (m < 60) return m + " dk";
    return Math.floor(m / 60) + " sa " + (m % 60) + " dk";
  }
  function num(n) { return (n || 0).toLocaleString("tr-TR"); }
  function phaseLabel(p) {
    return {
      idle: "Menüde",
      queue: "Kuyrukta",
      custom: "Özel lobide",
      pregame: "Ajan seçiminde",
      ingame: "Oyunda",
      paused: "Duraklatıldı",
      offline: "Oyun kapalı",
      closed: "Uygulama kapalı"
    }[p] || (p || "—");
  }
  function modeLabel(raw) {
    if (!raw) return "";
    raw = fixText(raw);
    var k = String(raw).toLocaleLowerCase("tr-TR").replace(/[\s_-]+/g, "");
    var map = {
      swiftplay: "Tam Gaz", tamgaz: "Tam Gaz",
      competitive: "Rekabetçi", rekabetçi: "Rekabetçi", rekabetci: "Rekabetçi",
      unrated: "Derecesiz", normal: "Derecesiz", derecesiz: "Derecesiz",
      spikerush: "Spike Hücumu",
      deathmatch: "Ölüm Kalım",
      ggteam: "Tırmanış", escalation: "Tırmanış",
      hurm: "Takım Ölüm Kalım", teamdeathmatch: "Takım Ölüm Kalım",
      onefa: "Replikasyon", replication: "Replikasyon",
      premier: "Premier", premierteam: "Premier",
      custom: "Özel Oyun", customgame: "Özel Oyun", özeloyun: "Özel Oyun",
      newmap: "Yeni Harita",
      snowball: "Kartopu Savaşı", snowballfight: "Kartopu Savaşı"
    };
    return map[k] || raw;
  }
  function inMatch(r) { return r.phase === "ingame" || r.phase === "pregame"; }
  function mapLabel(r) {
    if (!inMatch(r) || !r.map_name) return "";
    var m = fixText(r.map_name);
    return /^unknown$/i.test(m) ? "Bilinmeyen harita" : m;
  }
  function scoreText(r) {
    if (r.phase !== "ingame" || r.ally_score == null || r.enemy_score == null) return "";
    return r.ally_score + "–" + r.enemy_score;
  }
  function detail(r) {
    var bits = [];
    var mode = modeLabel(r.mode_name);
    if (mode && (inMatch(r) || r.phase === "queue" || r.phase === "custom")) bits.push(mode);
    var map = mapLabel(r);
    if (map) bits.push(map);
    if (r.agent && inMatch(r)) bits.push(r.agent);
    if (r.party_size > 1) bits.push(r.party_size + " kişilik parti");
    return bits.length ? bits.join(" · ") : "—";
  }
  function pill(p) {
    var k = p || "closed";
    return '<span class="pill ' + esc(k) + '">' + esc(phaseLabel(k)) + "</span>";
  }
  var PHASE_COLOR = { ingame: "#3dd68c", pregame: "#f0b95e", queue: "#7fa9ff", custom: "#c4a3ff", idle: "#b6b0a6", paused: "#8d877e", offline: "#67625b", closed: "#67625b" };
  function hue(s) {
    var h = 0;
    s = String(s || "?");
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function avatar(name, big) {
    var ch = name ? Array.from(String(name).trim())[0] || "?" : "?";
    return '<span class="avatar' + (big ? " lg" : "") + '" style="--h:' + hue(name) + '">' + esc(ch) + "</span>";
  }
  function nameCell(name) {
    if (!name) return '<div class="person">' + avatar("") + '<span class="nm muted">İsimsiz</span></div>';
    var s = String(name), i = s.lastIndexOf("#");
    var inner = i > 0 ? esc(s.slice(0, i)) + '<span class="tg">' + esc(s.slice(i)) + "</span>" : esc(s);
    return '<div class="person">' + avatar(s) + '<span class="nm">' + inner + "</span></div>";
  }
  function scoreHtml(r) {
    var t = scoreText(r);
    if (!t) return '<span class="muted">—</span>';
    var cls = r.ally_score > r.enemy_score ? "w" : r.ally_score < r.enemy_score ? "l" : "";
    return '<span class="score"><span class="' + cls + '">' + esc(t) + "</span></span>";
  }
  var ICONS = {
    live: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
    sun: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    users: '<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.6"/></svg>',
    box: '<svg class="ic" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>'
  };
  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms || 250);
    };
  }
  function rpc(name, args) {
    return sb.rpc(name, args || {}).then(function (res) {
      if (res.error) throw res.error;
      return res.data;
    });
  }
  function errText(e) {
    var msg = (e && (e.message || e.error_description)) || String(e);
    if (/forbidden|42501/i.test(msg) || (e && e.code === "42501")) return "Bu hesap yönetici değil (admins tablosunda yok).";
    if (/admin_overview|admin_live|admin_users|admin_sessions|admin_detail/.test(msg) && /function|schema cache/i.test(msg)) {
      return "Sunucu fonksiyonları bulunamadı. supabase/schema.sql dosyasını SQL Editor'da çalıştır.";
    }
    return msg;
  }

  // ---------------- yenileme durumu ----------------

  function pollMs() {
    var route = ROUTES[state.route];
    return route && route.poll ? route.poll : 0;
  }

  function setQueueBadge(n) {
    var el = $("queue-count");
    if (!el) return;
    n = n || 0;
    el.hidden = n < 1;
    el.textContent = n > 99 ? "99+" : String(n);
  }

  function setPill(kind) {
    var pillEl = $("live-pill");
    var ms = pollMs();
    pillEl.classList.toggle("on", kind === "ok" && ms > 0);
    var label = "elle yenile";
    if (ms) {
      label = document.visibilityState === "visible"
        ? "otomatik · " + Math.round(ms / 1000) + " sn"
        : "duraklatıldı";
    }
    pillEl.querySelector(".what").textContent =
      kind === "busy" ? "yükleniyor…" :
      kind === "err" ? "hata" : label;
    pillEl.querySelector(".when").textContent = state.loadedAt ? " · " + clock() : "";
  }

  function schedule() {
    clearTimeout(state.timer);
    var ms = pollMs();
    if (!ms) return;
    state.timer = setTimeout(function () {
      if (document.visibilityState === "visible") load({ quiet: true });
      else schedule();
    }, ms);
  }

  document.addEventListener("visibilitychange", function () {
    if (!state.user || !state.route) return;
    var ms = pollMs();
    if (document.visibilityState === "visible" && ms && Date.now() - state.loadedAt > ms) load({ quiet: true });
    else setPill("ok");
  });

  // ---------------- yönlendirme ----------------

  function routeFromHash() {
    var r = (location.hash || "").replace(/^#\/?/, "");
    return ROUTES[r] ? r : "overview";
  }

  function go(route) {
    if (location.hash !== "#/" + route) location.hash = "#/" + route;
    else enter(route);
  }

  window.addEventListener("hashchange", function () {
    if (state.user) enter(routeFromHash());
  });

  function enter(route) {
    var changed = state.route !== route;
    state.route = route;
    if (changed) {
      state.page = 1;
      state.phase = "";
      state.version = "";
      state.sort = ROUTES[route].sort || "";
      state.asc = false;
    }
    document.querySelectorAll("#nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-route") === route);
    });
    $("crumb").innerHTML = "<strong>" + esc(ROUTES[route].title) + "</strong>";
    $("rail").classList.remove("open");
    $("global-search").value = state.q;
    shell();
    load();
  }

  // Sayfa iskeleti bir kez çizilir; yenilemede yalnızca #body değişir.
  // Böylece arama kutusu yazarken sıfırlanmaz.
  function shell() {
    var r = state.route;
    var head = {
      overview: ["Genel bakış", "İstanbul saati. Çevrimiçi = son 6 dakikada sinyal gelen ve uygulaması açık kurulum. Bu sayfa 30 saniyede bir yenilenir."],
      live: ["Canlı", "Şu an uygulaması açık kurulumlar. Bu sayfa 30 saniyede bir yenilenir."],
      queue: ["Sırada", "Oyun arayanlar. Bu sayfa açıkken 5 saniyede bir yenilenir. Sıraya giriş kaydı overlay'den hemen gelir."],
      users: ["Kullanıcılar", "Overlay kullanan Riot hesapları. Liste elle yenilenir."],
      sessions: ["Oturumlar", "Uygulama açılışları, son 30 gün. Liste elle yenilenir."]
    }[r];
    var tools = "";
    if (r !== "overview" && r !== "queue") {
      tools = '<div class="toolbar">' +
        '<input class="grow" id="local-q" placeholder="İsim veya PUUID ara" autocomplete="off" value="' + esc(state.q) + '">' +
        (r === "live" ? '<select id="phase">' + ['<option value="">Tüm durumlar</option>'].concat(PHASES.map(function (p) {
          return '<option value="' + p + '"' + (state.phase === p ? " selected" : "") + ">" + esc(phaseLabel(p)) + "</option>";
        })).join("") + "</select>" : "") +
        '<select id="version"><option value="">Tüm sürümler</option></select>' +
        "</div>";
    }
    $("page").innerHTML =
      '<div class="page-head"><div><h1>' + esc(head[0]) + "</h1><p>" + esc(head[1]) + "</p></div></div>" +
      '<div id="notice"></div>' + tools + '<div id="body"><div class="loading">Yükleniyor…</div></div>';

    var q = $("local-q");
    if (q) q.oninput = debounce(function () { state.q = q.value; state.page = 1; $("global-search").value = state.q; load(); }, 300);
    var phase = $("phase");
    if (phase) phase.onchange = function () { state.phase = phase.value; state.page = 1; load(); };
    var version = $("version");
    if (version) version.onchange = function () { state.version = version.value; state.page = 1; load(); };
    fillVersions(state.versions || []);
  }

  function fillVersions(list) {
    var sel = $("version");
    if (!sel) return;
    var current = state.version;
    var opts = list.slice();
    if (current && opts.indexOf(current) === -1) opts.unshift(current);
    sel.innerHTML = '<option value="">Tüm sürümler</option>' + opts.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === current ? " selected" : "") + ">" + esc(v) + "</option>";
    }).join("");
  }

  // Sürüm listesi (Kullanıcılar / Oturumlar filtresi). Bir kez çekilir.
  function ensureVersions() {
    if (state.versions) return Promise.resolve(state.versions);
    return rpc("admin_overview").then(function (d) {
      state.versions = (d.versions || []).map(function (x) { return x.v; }).filter(Boolean);
      return state.versions;
    }).catch(function () { return []; });
  }

  // ---------------- yükleme ----------------

  var loaders = {};

  function load(opts) {
    var quiet = !!(opts && opts.quiet);
    var route = state.route;
    var seq = ++state.seq;
    clearTimeout(state.timer);
    if (!quiet) setPill("busy");
    var body = $("body");
    if (body && !quiet) body.classList.add("busy");
    return loaders[route]().then(function (html) {
      if (seq !== state.seq || route !== state.route) return;
      $("notice").innerHTML = "";
      $("body").innerHTML = html;
      $("body").classList.remove("busy");
      bindBody();
      state.loadedAt = Date.now();
      setPill("ok");
      schedule();
    }).catch(function (e) {
      if (seq !== state.seq) return;
      if ($("body")) $("body").classList.remove("busy");
      $("notice").innerHTML = '<div class="notice">' + esc(errText(e)) + "</div>";
      if ($("body") && /Yükleniyor/.test($("body").textContent)) $("body").innerHTML = "";
      setPill("err");
      schedule();
    });
  }

  function bindBody() {
    document.querySelectorAll("#body tr[data-puuid], #body tr[data-install]").forEach(function (tr) {
      tr.onclick = function () { openDrawer(tr.getAttribute("data-puuid"), tr.getAttribute("data-install")); };
    });
    document.querySelectorAll("#body th[data-sort]").forEach(function (th) {
      th.onclick = function () {
        var key = th.getAttribute("data-sort");
        if (state.sort === key) state.asc = !state.asc;
        else { state.sort = key; state.asc = key === "riot_name"; }
        state.page = 1;
        load();
      };
    });
    document.querySelectorAll("#body [data-page]").forEach(function (b) {
      b.onclick = function () {
        state.page = Math.max(1, state.page + (b.getAttribute("data-page") === "next" ? 1 : -1));
        load();
      };
    });
    document.querySelectorAll("#body [data-goto]").forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); go(a.getAttribute("data-goto")); };
    });
  }

  function th(label, key) {
    if (!key) return '<th class="nosort">' + label + "</th>";
    var mark = state.sort === key ? (state.asc ? " ↑" : " ↓") : "";
    return '<th data-sort="' + key + '"' + (mark ? ' class="sorted"' : "") + ">" + label + mark + "</th>";
  }

  function pager(total) {
    var pages = Math.max(1, Math.ceil(total / PAGE));
    var from = total ? (state.page - 1) * PAGE + 1 : 0;
    var to = Math.min(total, state.page * PAGE);
    return '<div class="pager"><span>' + num(from) + "–" + num(to) + " / " + num(total) + '</span><span class="spacer"></span>' +
      '<button class="btn ghost small" data-page="prev" ' + (state.page <= 1 ? "disabled" : "") + ">Önceki</button>" +
      "<span>" + state.page + " / " + pages + "</span>" +
      '<button class="btn ghost small" data-page="next" ' + (state.page >= pages ? "disabled" : "") + ">Sonraki</button></div>";
  }

  function rowAttrs(puuid, install) {
    return ' class="clickable" data-puuid="' + esc(puuid || "") + '" data-install="' + esc(install || "") + '"';
  }

  function stat(k, v, s, icon, tone) {
    return '<div class="stat" style="--tone:' + tone + '"><div class="top-row"><div class="k">' + esc(k) + '</div><div class="ico">' + icon +
      '</div></div><div class="v">' + v + '</div><div class="s">' + s + "</div></div>";
  }

  function bars(items, labelFn, opts) {
    opts = opts || {};
    if (!items.length) return '<div class="empty">Kayıt yok.</div>';
    var max = items.reduce(function (m, x) { return Math.max(m, x.n); }, 1);
    return items.map(function (x, i) {
      var c = opts.color ? opts.color(x) : "";
      var style = c ? ' style="--c:' + c + '"' : "";
      return '<div class="ver-row' + (i === 0 ? " top1" : "") + '"' + style + '><b' + (opts.mono ? ' class="mono"' : "") + ">" +
        (opts.dot ? '<i class="dot"></i>' : "") + esc(labelFn(x)) + '</b><div class="track"><i style="width:' +
        Math.max(2, Math.round(x.n / max * 100)) + '%"></i></div><span class="n">' + num(x.n) + "</span></div>";
    }).join("");
  }

  function liveTable(rows, compact) {
    if (!rows.length) return '<div class="empty">Şu an kimse yok.</div>';
    return '<div class="table-wrap"><table><thead><tr>' + th("Oyuncu") + th("Durum") + th("Ne yapıyor") + th("Skor") +
      (compact ? "" : th("Sürüm") + th("Bölge")) + th("Son sinyal") + "</tr></thead><tbody>" +
      rows.map(function (r) {
        var score = scoreText(r);
        return "<tr" + rowAttrs(r.puuid, r.install_id) + "><td>" + nameCell(r.riot_name) + "</td><td>" + pill(r.phase) +
          "</td><td>" + esc(detail(r)) + '</td><td class="mono">' +
          scoreHtml(r) + "</td>" +
          (compact ? "" : '<td><span class="chip">' + esc(r.app_version || "—") + '</span></td><td class="mono">' + esc((r.region || "—").toUpperCase()) + "</td>") +
          '<td class="muted" title="' + esc(fmt(r.last_seen)) + '">' + esc(ago(r.last_seen)) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  loaders.overview = function () {
    return rpc("admin_overview").then(function (d) {
      state.versions = (d.versions || []).map(function (x) { return x.v; }).filter(Boolean);
      var hours = d.hours || [];
      var maxH = Math.max.apply(null, hours.concat([1]));
      var phases = Object.keys(d.phases || {}).map(function (k) { return { k: k, n: d.phases[k] }; })
        .sort(function (a, b) { return PHASES.indexOf(a.k) - PHASES.indexOf(b.k); });
      setQueueBadge((d.phases && d.phases.queue) || 0);
      var recent = d.recent || [];
      var nowH = parseInt(new Date().toLocaleString("en-GB", { timeZone: "Europe/Istanbul", hour: "2-digit", hour12: false }), 10);
      var totalPhases = phases.reduce(function (t, x) { return t + x.n; }, 0);
      return '<div class="stats">' +
          stat("Şu an açık", num(d.online) + "<small>" + num(d.in_match) + " maçta</small>", "uygulaması açık kurulum", ICONS.live, "var(--ok)") +
          stat("Bugün aktif", num(d.today), num(d.launches_today) + " açılış", ICONS.sun, "var(--warn)") +
          stat("Kullanıcı", num(d.users), "Riot hesabı, tüm zamanlar", ICONS.users, "var(--info)") +
          stat("Kurulum", num(d.installs_30d), "son 30 günde görülen", ICONS.box, "var(--accent)") +
        "</div>" +
        '<div class="grid-2">' +
          '<section class="panel"><h2>Bugünkü açılışlar <span class="tag">saat başına</span></h2><div class="body">' +
            '<div class="hour-wrap">' +
              '<div class="hour-y"><span>' + num(maxH) + "</span><span>" + num(Math.round(maxH / 2)) + "</span><span>0</span></div>" +
              '<div class="hour-grid"><i></i><i></i><i></i></div>' +
              '<div class="hour">' + hours.map(function (n, h) {
                return '<span class="' + (h === nowH ? "now" : n === 0 ? "zero" : "") + '" style="height:' + (n === 0 ? 3 : Math.max(4, Math.round(n / maxH * 150))) + 'px" title="' + (h < 10 ? "0" : "") + h + ":00 · " + n + ' açılış"></span>';
              }).join("") + "</div>" +
              '<div class="hour-labels">' + hours.map(function (n, h) { return "<span>" + (h < 10 ? "0" : "") + h + "</span>"; }).join("") + "</div>" +
            "</div>" +
          "</div></section>" +
          '<section class="panel"><h2>Şu an ne yapıyorlar <span class="tag">' + num(totalPhases) + '</span></h2><div class="body">' +
            bars(phases, function (x) { return phaseLabel(x.k); }, { dot: true, color: function (x) { return PHASE_COLOR[x.k] || "#888"; } }) +
          "</div></section>" +
        "</div>" +
        '<div class="grid-2">' +
          '<section class="panel"><h2>Canlı <a href="#/live" data-goto="live" class="sub">tümü →</a></h2>' + liveTable(d.live || [], true) + "</section>" +
          '<section class="panel"><h2>Sürümler <span class="tag">kurulum · son 30 gün</span></h2><div class="body">' +
            bars(d.versions || [], function (x) { return x.v || "?"; }, { mono: true }) +
          "</div></section>" +
        "</div>" +
        '<section class="panel"><h2>Son açılışlar <a href="#/sessions" data-goto="sessions" class="sub">tümü →</a></h2>' +
          (recent.length ? '<div class="table-wrap"><table><tbody>' + recent.map(function (r) {
            return "<tr" + rowAttrs(r.puuid, r.install_id) + "><td>" + nameCell(r.riot_name) + '</td><td><span class="chip">' +
              esc(r.app_version || "—") + '</span></td><td class="muted" title="' + esc(fmt(r.started_at)) + '">' + esc(ago(r.started_at)) + "</td></tr>";
          }).join("") + "</tbody></table></div>" : '<div class="empty">Henüz oturum yok.</div>') +
        "</section>";
    });
  };

  loaders.live = function () {
    return rpc("admin_live", {
      p_phase: state.phase || null,
      p_version: state.version || null,
      p_q: state.q || null,
      p_offset: (state.page - 1) * PAGE,
      p_limit: PAGE
    }).then(function (d) {
      fillVersions(d.versions || []);
      return '<section class="panel"><h2>Uygulaması açık <span class="tag">' + num(d.total || 0) + "</span></h2>" + liveTable(d.rows || [], false) + pager(d.total || 0) + "</section>";
    });
  };

  loaders.queue = function () {
    return rpc("admin_live", {
      p_phase: "queue",
      p_version: null,
      p_q: null,
      p_offset: 0,
      p_limit: 100
    }).then(function (d) {
      var raw = d.rows || [];
      var rows = raw.filter(function (r) { return queueFresh(r.last_seen); });
      var total = raw.length >= (d.total || 0) ? rows.length : (d.total || rows.length);
      setQueueBadge(total);
      if (!rows.length) {
        return '<section class="panel"><div class="empty">Şu an sırada kimse yok.</div></section>';
      }
      return '<section class="panel"><h2>Oyun arayanlar <span class="tag">' + num(total) + "</span></h2>" +
        '<div class="table-wrap"><table><thead><tr>' +
          th("Oyuncu") + th("Mod") + th("Parti") + th("Bölge") + th("Sürüm") + th("Son sinyal") +
        "</tr></thead><tbody>" +
        rows.map(function (r) {
          var mode = modeLabel(r.mode_name) || modeLabel(r.queue_id) || "—";
          var party = r.party_size > 1 ? r.party_size + " kişi" : (r.party_size === 1 ? "Tek" : "—");
          return "<tr" + rowAttrs(r.puuid, r.install_id) + ">" +
            "<td>" + nameCell(r.riot_name) + "</td>" +
            "<td>" + esc(mode) + "</td>" +
            "<td>" + esc(party) + "</td>" +
            '<td class="mono">' + esc((r.region || "—").toUpperCase()) + "</td>" +
            '<td><span class="chip">' + esc(r.app_version || "—") + "</span></td>" +
            '<td class="muted" title="' + esc(fmt(r.last_seen)) + '">' + esc(ago(r.last_seen)) + "</td></tr>";
        }).join("") +
        "</tbody></table></div></section>";
    });
  };

  loaders.users = function () {
    return ensureVersions().then(function (vs) {
      fillVersions(vs);
      return rpc("admin_users", {
        p_q: state.q || null,
        p_version: state.version || null,
        p_sort: state.sort,
        p_asc: state.asc,
        p_offset: (state.page - 1) * PAGE,
        p_limit: PAGE
      });
    }).then(function (d) {
      var rows = d.rows || [];
      return '<section class="panel"><h2>Kullanıcılar <span class="tag">' + num(d.total || 0) + '</span></h2><div class="table-wrap"><table><thead><tr>' +
          th("Riot adı", "riot_name") + th("Durum") + th("Sürüm", "app_version") + th("İlk görülme", "first_seen") + th("Son görülme", "last_seen") + th("PUUID") +
        "</tr></thead><tbody>" +
        (rows.length ? rows.map(function (r) {
          return "<tr" + rowAttrs(r.puuid, r.install_id) + ">" +
            "<td>" + nameCell(r.riot_name) + "</td>" +
            "<td>" + (r.live_phase ? pill(r.live_phase) : '<span class="muted">—</span>') + "</td>" +
            '<td><span class="chip">' + esc(r.app_version || "—") + "</span></td>" +
            '<td class="muted" title="' + esc(fmt(r.first_seen)) + '">' + esc(fmt(r.first_seen)) + "</td>" +
            '<td class="muted" title="' + esc(fmt(r.last_seen)) + '">' + esc(ago(r.last_seen)) + "</td>" +
            '<td class="mono muted">' + esc((r.puuid || "").slice(0, 8)) + "…</td></tr>";
        }).join("") : '<tr><td colspan="6"><div class="empty">Kayıt yok.</div></td></tr>') +
        "</tbody></table></div>" + pager(d.total || 0) + "</section>";
    });
  };

  loaders.sessions = function () {
    return ensureVersions().then(function (vs) {
      fillVersions(vs);
      return rpc("admin_sessions", {
        p_q: state.q || null,
        p_version: state.version || null,
        p_sort: state.sort,
        p_asc: state.asc,
        p_offset: (state.page - 1) * PAGE,
        p_limit: PAGE
      });
    }).then(function (d) {
      var rows = d.rows || [];
      return '<section class="panel"><h2>Oturumlar <span class="tag">' + num(d.total || 0) + '</span></h2><div class="table-wrap"><table><thead><tr>' +
          th("Açılış", "started_at") + th("Oyuncu") + th("Sürüm") + th("Süre", "duration") +
        "</tr></thead><tbody>" +
        (rows.length ? rows.map(function (r) {
          return "<tr" + rowAttrs(r.puuid, r.install_id) + ">" +
            "<td>" + esc(fmt(r.started_at)) + "</td>" +
            "<td>" + nameCell(r.riot_name) + "</td>" +
            '<td><span class="chip">' + esc(r.app_version || "—") + "</span></td>" +
            "<td>" + esc(dur(r.duration)) + (r.live ? '<span class="badge-live">açık</span>' : "") + "</td></tr>";
        }).join("") : '<tr><td colspan="4"><div class="empty">Oturum yok.</div></td></tr>') +
        "</tbody></table></div>" + pager(d.total || 0) + "</section>";
    });
  };

  // ---------------- detay paneli ----------------

  var drawerSeq = 0;
  function kv(k, v) { return "<span>" + esc(k) + "</span><div>" + v + "</div>"; }

  function openDrawer(puuid, install) {
    var seq = ++drawerSeq;
    $("drawer-back").classList.add("on");
    $("drawer").classList.add("on");
    $("drawer").innerHTML = '<header><h3>Yükleniyor…</h3><button class="btn ghost small" id="close-drawer" type="button">Kapat</button></header>';
    $("close-drawer").onclick = closeDrawer;
    rpc("admin_detail", { p_puuid: puuid || null, p_install: install || null }).then(function (d) {
      if (seq !== drawerSeq) return;
      var u = d.user || {};
      var p = d.presence || null;
      if (p && p.phase !== "ingame" && p.phase !== "pregame" && p.phase !== "closed") {
        var party = String(p.party_state || "").toUpperCase();
        var searching = party === "MATCHMAKING" || party === "STARTING_MATCHMAKING" || party === "MATCHMADE_GAME_STARTING";
        if ((p.phase === "queue" || searching) && queueFresh(p.last_seen)) p.phase = "queue";
        else if (p.phase === "queue") p.phase = "idle";
      }
      var live = p && p.phase !== "closed" && Date.now() - new Date(p.last_seen).getTime() < 360000;
      var name = u.riot_name || (p && p.riot_name) || "İsimsiz";
      var id = u.puuid || puuid || "";
      var rows = kv("Durum", live ? pill(p.phase) : pill("closed"));
      if (live) {
        rows += kv("Ne yapıyor", esc(detail(p)));
        if (inMatch(p)) {
          rows += kv("Harita", esc(mapLabel(p) || "—"));
          rows += kv("Ajan", esc(p.agent || "—"));
          if (p.phase === "ingame") rows += kv("Skor", esc(scoreText(p) || "—"));
        }
        if (p.mode_name) rows += kv("Mod", esc(modeLabel(p.mode_name)));
        if (p.party_size) rows += kv("Parti", esc(p.party_size > 1 ? p.party_size + " kişi" : "Tek"));
      }
      rows += kv("Son sinyal", esc(p ? ago(p.last_seen) + " · " + fmt(p.last_seen) : "—"));
      rows += kv("Sürüm", esc((p && p.app_version) || u.app_version || "—"));
      rows += kv("Bölge", esc(((p && p.region) || "—").toUpperCase()));
      rows += kv("İlk görülme", esc(fmt(u.first_seen)));
      rows += kv("PUUID", id ? '<div class="mono">' + esc(id) + '</div><button class="copy" id="copy-id" type="button">Kopyala</button>' : "—");
      rows += kv("Kurulum", '<div class="mono">' + esc((p && p.install_id) || install || u.install_id || "—") + "</div>");

      var accounts = d.accounts || [];
      var sessions = d.sessions || [];
      $("drawer").innerHTML =
        '<header><div class="who-head">' + avatar(name, true) + '<h3>' + esc(name) + '</h3></div><button class="btn ghost small" id="close-drawer" type="button">Kapat</button></header>' +
        '<div class="kv">' + rows + "</div>" +
        (accounts.length > 1 ? '<section class="panel" style="margin:0 24px 20px"><h2>Bu kurulumdaki hesaplar</h2><table><tbody>' +
          accounts.map(function (a) {
            return "<tr><td>" + nameCell(a.riot_name) + '</td><td class="muted">' + esc(ago(a.last_seen)) + "</td></tr>";
          }).join("") + "</tbody></table></section>" : "") +
        '<section class="panel" style="margin:0 24px 24px"><h2>Son oturumlar</h2>' +
          (sessions.length ? "<table><tbody>" + sessions.map(function (s) {
            return "<tr><td>" + esc(fmt(s.started_at)) + "</td><td>" + esc(dur(s.duration)) + '</td><td class="mono">' + esc(s.app_version || "—") + "</td></tr>";
          }).join("") + "</tbody></table>" : '<div class="empty">Oturum yok.</div>') +
        "</section>";
      $("close-drawer").onclick = closeDrawer;
      var copy = $("copy-id");
      if (copy) copy.onclick = function () {
        navigator.clipboard.writeText(id).then(function () { copy.textContent = "Kopyalandı"; });
      };
    }).catch(function (e) {
      if (seq !== drawerSeq) return;
      $("drawer").innerHTML = '<header><h3>Hata</h3><button class="btn ghost small" id="close-drawer" type="button">Kapat</button></header>' +
        '<div class="kv"><div class="notice" style="grid-column:1/-1">' + esc(errText(e)) + "</div></div>";
      $("close-drawer").onclick = closeDrawer;
    });
  }

  function closeDrawer() {
    drawerSeq++;
    $("drawer").classList.remove("on");
    $("drawer-back").classList.remove("on");
  }

  // ---------------- olaylar ----------------

  $("nav").onclick = function (e) {
    var b = e.target.closest("button");
    if (b) go(b.getAttribute("data-route"));
  };
  $("menu").onclick = function () { $("rail").classList.toggle("open"); };
  $("refresh").onclick = function () { load(); };
  $("drawer-back").onclick = closeDrawer;
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
  $("global-search").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    state.q = e.target.value.trim();
    state.page = 1;
    if (state.route === "overview" || state.route === "queue") go("users");
    else { var q = $("local-q"); if (q) q.value = state.q; load(); }
  });
  $("signout").onclick = function () { sb.auth.signOut(); };
  $("signin").onsubmit = function (e) {
    e.preventDefault();
    $("login-error").textContent = "";
    $("signin-btn").disabled = true;
    sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    }).then(function (res) {
      if (res.error) $("login-error").textContent = res.error.message;
    }).finally(function () { $("signin-btn").disabled = false; });
  };

  var badgeTimer = null;
  function scheduleBadge() {
    clearTimeout(badgeTimer);
    if (!state.user) return;
    badgeTimer = setTimeout(function () {
      if (!state.user) return;
      if (state.route === "queue" || state.route === "overview" || document.visibilityState !== "visible") {
        scheduleBadge();
        return;
      }
      rpc("admin_live", { p_phase: "queue", p_offset: 0, p_limit: 1 }).then(function (d) {
        if (state.route !== "queue" && state.route !== "overview") setQueueBadge(d.total || 0);
      }).catch(function () {}).then(scheduleBadge);
    }, 15000);
  }

  function showApp(user) {
    if (state.user && state.user.id === user.id) return;
    state.user = user;
    $("login-screen").style.display = "none";
    $("app").classList.add("on");
    $("who").textContent = user.email || "";
    enter(routeFromHash());
    scheduleBadge();
  }

  function showLogin() {
    state.user = null;
    state.route = null;
    clearTimeout(state.timer);
    clearTimeout(badgeTimer);
    $("app").classList.remove("on");
    $("login-screen").style.display = "grid";
    closeDrawer();
  }

  sb.auth.onAuthStateChange(function (_e, session) {
    if (session && session.user) showApp(session.user);
    else showLogin();
  });
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) showApp(res.data.session.user);
    else showLogin();
  });
})();
</script>
</body>
</html>
