<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker — Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --rail: #101013;
    --surface: #141418;
    --surface-2: #1b1b20;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --text: #f3efe8;
    --muted: #8d877e;
    --faint: #5e5953;
    --accent: #ff4655;
    --accent-dim: rgba(255,70,85,0.14);
    --ok: #3dd68c;
    --warn: #e2b15a;
    --shadow: 0 18px 50px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  .login-screen {
    min-height: 100%;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
  }
  .login-brand {
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      linear-gradient(160deg, rgba(255,70,85,0.16), transparent 42%),
      var(--rail);
    border-right: 1px solid var(--line);
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    font-size: 12px;
  }
  .mark i {
    width: 10px;
    height: 10px;
    background: var(--accent);
    display: block;
  }
  .login-brand h1 {
    margin: 0;
    font-size: 42px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.03em;
    max-width: 12ch;
  }
  .login-brand p { color: var(--muted); max-width: 36ch; margin: 16px 0 0; }
  .login-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .login-card { width: min(360px, 100%); }
  .login-card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .field span { color: var(--muted); font-size: 12px; }
  input, select {
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    padding: 9px 10px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .btn {
    border: 1px solid transparent;
    background: var(--accent);
    color: #fff;
    border-radius: 2px;
    padding: 9px 14px;
    font-weight: 500;
  }
  .btn.ghost {
    background: transparent;
    border-color: var(--line-strong);
    color: var(--text);
  }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .err { color: var(--accent); min-height: 1.2em; margin-top: 10px; font-size: 13px; }
  .login-card .btn { width: 100%; margin-top: 18px; }

  .app { display: none; min-height: 100%; }
  .app.on { display: grid; grid-template-columns: 228px 1fr; }
  .rail {
    background: var(--rail);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 18px 12px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 28px; }
  .nav button {
    text-align: left;
    background: transparent;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--muted);
    padding: 9px 12px;
    border-radius: 0;
  }
  .nav button.active {
    color: var(--text);
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }
  .nav button:hover { color: var(--text); }
  .rail-foot { margin-top: auto; padding: 12px; color: var(--muted); font-size: 12px; }
  .rail-foot .who { color: var(--text); margin-bottom: 10px; word-break: break-all; }
  .rail-foot .btn { width: 100%; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(10,10,12,0.92);
    backdrop-filter: blur(10px);
    z-index: 2;
  }
  .menu-btn { display: none; }
  .crumb { font-size: 13px; color: var(--muted); }
  .crumb strong { color: var(--text); font-weight: 600; }
  .top-spacer { flex: 1; }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
  }
  .live-pill i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--faint);
    display: block;
  }
  .live-pill.on i { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,214,140,0.15); }
  .search {
    width: min(280px, 36vw);
    background: var(--surface);
  }

  .page { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .page-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; }
  .page-head h1 { margin: 0; font-size: 26px; letter-spacing: -0.03em; font-weight: 600; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 14px 14px 12px;
  }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 28px; letter-spacing: -0.04em; margin-top: 6px; font-weight: 600; }
  .stat .s { color: var(--faint); font-size: 12px; margin-top: 4px; }

  .grid-2 { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 10px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    min-width: 0;
  }
  .panel h2 {
    margin: 0;
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
  }
  .panel .body { padding: 12px 14px 14px; }

  .hour {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 3px;
    align-items: end;
    height: 92px;
  }
  .hour span {
    display: block;
    background: var(--accent);
    min-height: 2px;
    opacity: 0.85;
  }
  .hour-labels {
    display: flex;
    justify-content: space-between;
    color: var(--faint);
    font-size: 11px;
    margin-top: 6px;
    font-family: "IBM Plex Mono", monospace;
  }
  .ver-row { display: grid; grid-template-columns: 72px 1fr 36px; gap: 8px; align-items: center; margin: 7px 0; font-size: 13px; }
  .ver-row b { font-weight: 500; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .track { height: 6px; background: var(--surface-2); }
  .track i { display: block; height: 100%; background: var(--accent); }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input, .toolbar select { background: var(--surface); }
  .toolbar .grow { flex: 1; min-width: 180px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th {
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th.nosort { cursor: default; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: rgba(255,255,255,0.025); }
  .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 7px;
    border: 1px solid var(--line-strong);
    font-size: 12px;
    color: var(--text);
  }
  .pill.ingame { border-color: rgba(61,214,140,0.45); color: var(--ok); }
  .pill.pregame { border-color: rgba(226,177,90,0.5); color: var(--warn); }
  .pill.queue { border-color: rgba(120,170,255,0.5); color: #9ec1ff; }
  .pill.custom { border-color: rgba(190,150,255,0.5); color: #d2b8ff; }
  .pill.idle, .pill.paused, .pill.offline { color: var(--muted); }

  .pager {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 12px;
  }
  .pager .spacer { flex: 1; }
  .empty, .loading {
    padding: 28px 14px;
    color: var(--muted);
  }
  .skel {
    height: 12px;
    background: linear-gradient(90deg, var(--surface-2), #24242a, var(--surface-2));
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    margin: 10px 0;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .drawer-back {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    z-index: 5;
  }
  .drawer-back.on { display: block; }
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(420px, 100%);
    background: var(--rail);
    border-left: 1px solid var(--line);
    z-index: 6;
    transform: translateX(100%);
    transition: transform 0.18s ease;
    overflow: auto;
    box-shadow: var(--shadow);
  }
  .drawer.on { transform: none; }
  .drawer header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }
  .drawer h3 { margin: 0; font-size: 16px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 10px; padding: 16px; font-size: 13px; }
  .kv span { color: var(--muted); }
  .copy {
    background: none;
    border: 0;
    color: var(--accent);
    padding: 0;
    font-size: 12px;
  }

  @media (max-width: 980px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
    .login-screen { grid-template-columns: 1fr; }
    .login-brand { display: none; }
  }
  @media (max-width: 760px) {
    .app.on { grid-template-columns: 1fr; }
    .rail {
      position: fixed;
      z-index: 7;
      transform: translateX(-105%);
      transition: transform 0.16s ease;
      width: 240px;
    }
    .rail.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .search { display: none; }
  }
  .stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; letter-spacing: 0; }
  .live-pill .when { color: var(--faint); }
  .badge-live {
    display: inline-block;
    margin-left: 6px;
    padding: 0 5px;
    font-size: 10px;
    color: var(--ok);
    border: 1px solid rgba(61,214,140,0.45);
    vertical-align: 1px;
  }
  .pill.closed { color: var(--faint); border-color: var(--line); }
  .notice {
    border: 1px solid rgba(255,70,85,0.35);
    background: var(--accent-dim);
    padding: 10px 12px;
    font-size: 13px;
  }
  .busy { opacity: 0.55; transition: opacity 0.15s; }
  .table-wrap { overflow-x: auto; }
  .sub { color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<div id="config-error" class="login-panel" style="display:none">
  <div class="login-card">
    <h2>Yapılandırma eksik</h2>
    <p class="muted">config.js içinde Supabase adresi ve anon anahtar olmalı.</p>
  </div>
</div>

<div id="login-screen" class="login-screen" style="display:none">
  <div class="login-brand">
    <div class="mark"><i></i> VALORANT TRACKER</div>
    <div>
      <h1>Kim açık, kim hangi sürümde.</h1>
      <p>Kurulumlar, oturumlar ve lobideki overlay kullanıcıları. Saatler İstanbul.</p>
    </div>
    <div class="muted">Yönetici girişi</div>
  </div>
  <div class="login-panel">
    <form id="signin" class="login-card">
      <h2>Giriş</h2>
      <p class="muted">Bu ekran sadece sana açık.</p>
      <label class="field"><span>E-posta</span><input id="email" type="email" required autocomplete="username"></label>
      <label class="field"><span>Şifre</span><input id="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" id="signin-btn">Giriş yap</button>
      <div id="login-error" class="err"></div>
    </form>
  </div>
</div>

<div id="app" class="app">
  <aside class="rail" id="rail">
    <div class="mark"><i></i> TRACKER</div>
    <nav class="nav" id="nav">
      <button data-route="overview">Genel bakış</button>
      <button data-route="live">Canlı</button>
      <button data-route="users">Kullanıcılar</button>
      <button data-route="sessions">Oturumlar</button>
    </nav>
    <div class="rail-foot">
      <div class="who" id="who"></div>
      <button class="btn ghost small" id="signout" type="button">Çıkış</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn ghost small menu-btn" id="menu" type="button">Menü</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-spacer"></div>
      <div class="live-pill" id="live-pill"><i></i><span class="what">—</span><span class="when"></span></div>
      <input class="search" id="global-search" placeholder="İsim veya PUUID, Enter" autocomplete="off">
      <button class="btn ghost small" id="refresh" type="button">Yenile</button>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>
<div class="drawer-back" id="drawer-back"></div>
<aside class="drawer" id="drawer"></aside>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------
  // Ücretsiz kota: Realtime yok. Tüm sayımlar sunucuda (admin_* RPC).
  // Genel bakış / Canlı sekme görünürken 30 sn'de bir tek istekle
  // yenilenir; listeler (Kullanıcılar / Oturumlar) yalnızca istenince.
  // ------------------------------------------------------------------

  var cfg = window.TELEMETRY_CONFIG;
  if (!cfg || !cfg.url || !cfg.anonKey || cfg.url.indexOf("YOUR_PROJECT") !== -1 || cfg.anonKey.indexOf("YOUR_ANON_KEY") !== -1) {
    document.getElementById("config-error").style.display = "block";
    return;
  }

  var sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  var PAGE = 25;
  var POLL_MS = 30000;

  var ROUTES = {
    overview: { title: "Genel bakış", poll: true },
    live: { title: "Canlı", poll: true },
    users: { title: "Kullanıcılar", poll: false, sorts: ["riot_name", "app_version", "first_seen", "last_seen"], sort: "last_seen" },
    sessions: { title: "Oturumlar", poll: false, sorts: ["started_at", "duration"], sort: "started_at" }
  };
  var PHASES = ["ingame", "pregame", "queue", "custom", "idle", "paused", "offline"];

  var state = {
    route: null,
    q: "",
    page: 1,
    sort: "",
    asc: false,
    phase: "",
    version: "",
    versions: null,
    seq: 0,
    timer: null,
    loadedAt: 0,
    user: null
  };

  // ---------------- yardımcılar ----------------

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // UTF-8'in Windows-1252 diye okunmasıyla bozulmuş Türkçe harfleri onarır
  // (eski kayıtlar için; sunucu yeni kayıtları zaten düzeltiyor).
  var MOJIBAKE = [["Ã§","ç"],["Ã‡","Ç"],["ÄŸ","ğ"],["Äž","Ğ"],["Ä±","ı"],["Ä°","İ"],["Ã¶","ö"],["Ã–","Ö"],["ÅŸ","ş"],["Åž","Ş"],["Ã¼","ü"],["Ãœ","Ü"]];
  function fixText(s) {
    if (s == null) return s;
    s = String(s);
    if (!/[ÃÄÅ]/.test(s)) return s;
    MOJIBAKE.forEach(function (p) { s = s.split(p[0]).join(p[1]); });
    return s;
  }
  function ago(iso) {
    if (!iso) return "—";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "—";
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return s + " sn önce";
    if (s < 3600) return Math.floor(s / 60) + " dk önce";
    if (s < 86400) return Math.floor(s / 3600) + " sa önce";
    return Math.floor(s / 86400) + " gün önce";
  }
  function fmt(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleString("tr-TR", {
      timeZone: "Europe/Istanbul",
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
    });
  }
  function clock() {
    return new Date().toLocaleTimeString("tr-TR", { timeZone: "Europe/Istanbul", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  function dur(sec) {
    if (sec == null) return "—";
    var m = Math.max(0, Math.round(sec / 60));
    if (m < 1) return "<1 dk";
    if (m < 60) return m + " dk";
    return Math.floor(m / 60) + " sa " + (m % 60) + " dk";
  }
  function num(n) { return (n || 0).toLocaleString("tr-TR"); }
  function phaseLabel(p) {
    return {
      idle: "Menüde",
      queue: "Kuyrukta",
      custom: "Özel lobide",
      pregame: "Ajan seçiminde",
      ingame: "Oyunda",
      paused: "Duraklatıldı",
      offline: "Oyun kapalı",
      closed: "Uygulama kapalı"
    }[p] || (p || "—");
  }
  function modeLabel(raw) {
    if (!raw) return "";
    raw = fixText(raw);
    var k = String(raw).toLocaleLowerCase("tr-TR").replace(/[\s_-]+/g, "");
    var map = {
      swiftplay: "Tam Gaz", tamgaz: "Tam Gaz",
      competitive: "Rekabetçi", rekabetçi: "Rekabetçi", rekabetci: "Rekabetçi",
      unrated: "Derecesiz", normal: "Derecesiz", derecesiz: "Derecesiz",
      spikerush: "Spike Hücumu",
      deathmatch: "Ölüm Kalım",
      ggteam: "Tırmanış", escalation: "Tırmanış",
      hurm: "Takım Ölüm Kalım", teamdeathmatch: "Takım Ölüm Kalım",
      onefa: "Replikasyon", replication: "Replikasyon",
      premier: "Premier", premierteam: "Premier",
      custom: "Özel Oyun", customgame: "Özel Oyun", özeloyun: "Özel Oyun",
      newmap: "Yeni Harita",
      snowball: "Kartopu Savaşı", snowballfight: "Kartopu Savaşı"
    };
    return map[k] || raw;
  }
  function inMatch(r) { return r.phase === "ingame" || r.phase === "pregame"; }
  function mapLabel(r) {
    if (!inMatch(r) || !r.map_name) return "";
    var m = fixText(r.map_name);
    return /^unknown$/i.test(m) ? "Bilinmeyen harita" : m;
  }
  function scoreText(r) {
    if (r.phase !== "ingame" || r.ally_score == null || r.enemy_score == null) return "";
    return r.ally_score + "–" + r.enemy_score;
  }
  function detail(r) {
    var bits = [];
    var mode = modeLabel(r.mode_name);
    if (mode && (inMatch(r) || r.phase === "queue" || r.phase === "custom")) bits.push(mode);
    var map = mapLabel(r);
    if (map) bits.push(map);
    var score = scoreText(r);
    if (score) bits.push(score);
    if (r.agent && inMatch(r)) bits.push(r.agent);
    if (r.party_size > 1) bits.push(r.party_size + " kişilik parti");
    return bits.length ? bits.join(" · ") : "—";
  }
  function pill(p) {
    var k = p || "closed";
    return '<span class="pill ' + esc(k) + '">' + esc(phaseLabel(k)) + "</span>";
  }
  function nameCell(name) {
    return name ? esc(name) : '<span class="muted">İsimsiz</span>';
  }
  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms || 250);
    };
  }
  function rpc(name, args) {
    return sb.rpc(name, args || {}).then(function (res) {
      if (res.error) throw res.error;
      return res.data;
    });
  }
  function errText(e) {
    var msg = (e && (e.message || e.error_description)) || String(e);
    if (/forbidden|42501/i.test(msg) || (e && e.code === "42501")) return "Bu hesap yönetici değil (admins tablosunda yok).";
    if (/admin_overview|admin_live|admin_users|admin_sessions|admin_detail/.test(msg) && /function|schema cache/i.test(msg)) {
      return "Sunucu fonksiyonları bulunamadı. supabase/schema.sql dosyasını SQL Editor'da çalıştır.";
    }
    return msg;
  }

  // ---------------- yenileme durumu ----------------

  function setPill(kind) {
    var pillEl = $("live-pill");
    var auto = ROUTES[state.route] && ROUTES[state.route].poll;
    pillEl.classList.toggle("on", kind === "ok" && auto);
    pillEl.querySelector(".what").textContent =
      kind === "busy" ? "yükleniyor…" :
      kind === "err" ? "hata" :
      auto ? (document.visibilityState === "visible" ? "otomatik · 30 sn" : "duraklatıldı") : "elle yenile";
    pillEl.querySelector(".when").textContent = state.loadedAt ? " · " + clock() : "";
  }

  function schedule() {
    clearTimeout(state.timer);
    if (!ROUTES[state.route] || !ROUTES[state.route].poll) return;
    state.timer = setTimeout(function () {
      if (document.visibilityState === "visible") load();
      else schedule();
    }, POLL_MS);
  }

  document.addEventListener("visibilitychange", function () {
    if (!state.user || !state.route) return;
    var auto = ROUTES[state.route].poll;
    if (document.visibilityState === "visible" && auto && Date.now() - state.loadedAt > POLL_MS) load();
    else setPill("ok");
  });

  // ---------------- yönlendirme ----------------

  function routeFromHash() {
    var r = (location.hash || "").replace(/^#\/?/, "");
    return ROUTES[r] ? r : "overview";
  }

  function go(route) {
    if (location.hash !== "#/" + route) location.hash = "#/" + route;
    else enter(route);
  }

  window.addEventListener("hashchange", function () {
    if (state.user) enter(routeFromHash());
  });

  function enter(route) {
    var changed = state.route !== route;
    state.route = route;
    if (changed) {
      state.page = 1;
      state.phase = "";
      state.version = "";
      state.sort = ROUTES[route].sort || "";
      state.asc = false;
    }
    document.querySelectorAll("#nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-route") === route);
    });
    $("crumb").innerHTML = "<strong>" + esc(ROUTES[route].title) + "</strong>";
    $("rail").classList.remove("open");
    $("global-search").value = state.q;
    shell();
    load();
  }

  // Sayfa iskeleti bir kez çizilir; yenilemede yalnızca #body değişir.
  // Böylece arama kutusu yazarken sıfırlanmaz.
  function shell() {
    var r = state.route;
    var head = {
      overview: ["Genel bakış", "İstanbul saati. Çevrimiçi = son 6 dakikada sinyal gelen ve uygulaması açık kurulum."],
      live: ["Canlı", "Şu an uygulaması açık kurulumlar."],
      users: ["Kullanıcılar", "Overlay kullanan Riot hesapları."],
      sessions: ["Oturumlar", "Uygulama açılışları, son 30 gün."]
    }[r];
    var tools = "";
    if (r !== "overview") {
      tools = '<div class="toolbar">' +
        '<input class="grow" id="local-q" placeholder="İsim veya PUUID ara" autocomplete="off" value="' + esc(state.q) + '">' +
        (r === "live" ? '<select id="phase">' + ['<option value="">Tüm durumlar</option>'].concat(PHASES.map(function (p) {
          return '<option value="' + p + '"' + (state.phase === p ? " selected" : "") + ">" + esc(phaseLabel(p)) + "</option>";
        })).join("") + "</select>" : "") +
        '<select id="version"><option value="">Tüm sürümler</option></select>' +
        "</div>";
    }
    $("page").innerHTML =
      '<div class="page-head"><div><h1>' + esc(head[0]) + "</h1><p>" + esc(head[1]) + "</p></div></div>" +
      '<div id="notice"></div>' + tools + '<div id="body"><div class="loading">Yükleniyor…</div></div>';

    var q = $("local-q");
    if (q) q.oninput = debounce(function () { state.q = q.value; state.page = 1; $("global-search").value = state.q; load(); }, 300);
    var phase = $("phase");
    if (phase) phase.onchange = function () { state.phase = phase.value; state.page = 1; load(); };
    var version = $("version");
    if (version) version.onchange = function () { state.version = version.value; state.page = 1; load(); };
    fillVersions(state.versions || []);
  }

  function fillVersions(list) {
    var sel = $("version");
    if (!sel) return;
    var current = state.version;
    var opts = list.slice();
    if (current && opts.indexOf(current) === -1) opts.unshift(current);
    sel.innerHTML = '<option value="">Tüm sürümler</option>' + opts.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === current ? " selected" : "") + ">" + esc(v) + "</option>";
    }).join("");
  }

  // Sürüm listesi (Kullanıcılar / Oturumlar filtresi). Bir kez çekilir.
  function ensureVersions() {
    if (state.versions) return Promise.resolve(state.versions);
    return rpc("admin_overview").then(function (d) {
      state.versions = (d.versions || []).map(function (x) { return x.v; }).filter(Boolean);
      return state.versions;
    }).catch(function () { return []; });
  }

  // ---------------- yükleme ----------------

  var loaders = {};

  function load() {
    var route = state.route;
    var seq = ++state.seq;
    clearTimeout(state.timer);
    setPill("busy");
    var body = $("body");
    if (body) body.classList.add("busy");
    return loaders[route]().then(function (html) {
      if (seq !== state.seq || route !== state.route) return;
      $("notice").innerHTML = "";
      $("body").innerHTML = html;
      $("body").classList.remove("busy");
      bindBody();
      state.loadedAt = Date.now();
      setPill("ok");
      schedule();
    }).catch(function (e) {
      if (seq !== state.seq) return;
      if ($("body")) $("body").classList.remove("busy");
      $("notice").innerHTML = '<div class="notice">' + esc(errText(e)) + "</div>";
      if ($("body") && /Yükleniyor/.test($("body").textContent)) $("body").innerHTML = "";
      setPill("err");
      schedule();
    });
  }

  function bindBody() {
    document.querySelectorAll("#body tr[data-puuid], #body tr[data-install]").forEach(function (tr) {
      tr.onclick = function () { openDrawer(tr.getAttribute("data-puuid"), tr.getAttribute("data-install")); };
    });
    document.querySelectorAll("#body th[data-sort]").forEach(function (th) {
      th.onclick = function () {
        var key = th.getAttribute("data-sort");
        if (state.sort === key) state.asc = !state.asc;
        else { state.sort = key; state.asc = key === "riot_name"; }
        state.page = 1;
        load();
      };
    });
    document.querySelectorAll("#body [data-page]").forEach(function (b) {
      b.onclick = function () {
        state.page = Math.max(1, state.page + (b.getAttribute("data-page") === "next" ? 1 : -1));
        load();
      };
    });
    document.querySelectorAll("#body [data-goto]").forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); go(a.getAttribute("data-goto")); };
    });
  }

  function th(label, key) {
    if (!key) return '<th class="nosort">' + label + "</th>";
    var mark = state.sort === key ? (state.asc ? " ↑" : " ↓") : "";
    return '<th data-sort="' + key + '">' + label + mark + "</th>";
  }

  function pager(total) {
    var pages = Math.max(1, Math.ceil(total / PAGE));
    var from = total ? (state.page - 1) * PAGE + 1 : 0;
    var to = Math.min(total, state.page * PAGE);
    return '<div class="pager"><span>' + num(from) + "–" + num(to) + " / " + num(total) + '</span><span class="spacer"></span>' +
      '<button class="btn ghost small" data-page="prev" ' + (state.page <= 1 ? "disabled" : "") + ">Önceki</button>" +
      "<span>" + state.page + " / " + pages + "</span>" +
      '<button class="btn ghost small" data-page="next" ' + (state.page >= pages ? "disabled" : "") + ">Sonraki</button></div>";
  }

  function rowAttrs(puuid, install) {
    return ' class="clickable" data-puuid="' + esc(puuid || "") + '" data-install="' + esc(install || "") + '"';
  }

  function stat(k, v, s) {
    return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div><div class="s">' + s + "</div></div>";
  }

  function bars(items, labelFn) {
    if (!items.length) return '<div class="empty">Kayıt yok.</div>';
    var max = items.reduce(function (m, x) { return Math.max(m, x.n); }, 1);
    return items.map(function (x) {
      return '<div class="ver-row"><b>' + esc(labelFn(x)) + '</b><div class="track"><i style="width:' +
        Math.max(2, Math.round(x.n / max * 100)) + '%"></i></div><span>' + num(x.n) + "</span></div>";
    }).join("");
  }

  function liveTable(rows, compact) {
    if (!rows.length) return '<div class="empty">Şu an kimse yok.</div>';
    return '<div class="table-wrap"><table><thead><tr>' + th("Oyuncu") + th("Durum") + th("Ne yapıyor") +
      (compact ? "" : th("Sürüm") + th("Bölge")) + th("Son sinyal") + "</tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr" + rowAttrs(r.puuid, r.install_id) + "><td>" + nameCell(r.riot_name) + "</td><td>" + pill(r.phase) +
          "</td><td>" + esc(detail(r)) + "</td>" +
          (compact ? "" : '<td class="mono">' + esc(r.app_version || "—") + '</td><td class="mono">' + esc((r.region || "—").toUpperCase()) + "</td>") +
          '<td class="muted" title="' + esc(fmt(r.last_seen)) + '">' + esc(ago(r.last_seen)) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  loaders.overview = function () {
    return rpc("admin_overview").then(function (d) {
      state.versions = (d.versions || []).map(function (x) { return x.v; }).filter(Boolean);
      var hours = d.hours || [];
      var maxH = Math.max.apply(null, hours.concat([1]));
      var phases = Object.keys(d.phases || {}).map(function (k) { return { k: k, n: d.phases[k] }; })
        .sort(function (a, b) { return PHASES.indexOf(a.k) - PHASES.indexOf(b.k); });
      var recent = d.recent || [];
      return '<div class="stats">' +
          stat("Şu an açık", num(d.online) + "<small>" + num(d.in_match) + " maçta</small>", "uygulaması açık kurulum") +
          stat("Bugün aktif", num(d.today), num(d.launches_today) + " açılış") +
          stat("Kullanıcı", num(d.users), "Riot hesabı, tüm zamanlar") +
          stat("Kurulum", num(d.installs_30d), "son 30 günde görülen") +
        "</div>" +
        '<div class="grid-2">' +
          '<section class="panel"><h2>Bugünkü açılışlar (saat)</h2><div class="body">' +
            '<div class="hour">' + hours.map(function (n, h) {
              return '<span style="height:' + Math.max(2, Math.round(n / maxH * 92)) + 'px" title="' + (h < 10 ? "0" : "") + h + ":00 · " + n + ' açılış"></span>';
            }).join("") + "</div>" +
            '<div class="hour-labels"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>' +
          "</div></section>" +
          '<section class="panel"><h2>Şu an ne yapıyorlar</h2><div class="body">' +
            bars(phases, function (x) { return phaseLabel(x.k); }) +
          "</div></section>" +
        "</div>" +
        '<div class="grid-2">' +
          '<section class="panel"><h2>Canlı <a href="#/live" data-goto="live" class="sub">tümü →</a></h2>' + liveTable(d.live || [], true) + "</section>" +
          '<section class="panel"><h2>Sürümler (kurulum, son 30 gün)</h2><div class="body">' +
            bars(d.versions || [], function (x) { return x.v || "?"; }) +
          "</div></section>" +
        "</div>" +
        '<section class="panel"><h2>Son açılışlar <a href="#/sessions" data-goto="sessions" class="sub">tümü →</a></h2>' +
          (recent.length ? '<div class="table-wrap"><table><tbody>' + recent.map(function (r) {
            return "<tr" + rowAttrs(r.puuid, r.install_id) + "><td>" + nameCell(r.riot_name) + '</td><td class="mono">' +
              esc(r.app_version || "—") + '</td><td class="muted" title="' + esc(fmt(r.started_at)) + '">' + esc(ago(r.started_at)) + "</td></tr>";
          }).join("") + "</tbody></table></div>" : '<div class="empty">Henüz oturum yok.</div>') +
        "</section>";
    });
  };

  loaders.live = function () {
    return rpc("admin_live", {
      p_phase: state.phase || null,
      p_version: state.version || null,
      p_q: state.q || null,
      p_offset: (state.page - 1) * PAGE,
      p_limit: PAGE
    }).then(function (d) {
      fillVersions(d.versions || []);
      return '<section class="panel">' + liveTable(d.rows || [], false) + pager(d.total || 0) + "</section>";
    });
  };

  loaders.users = function () {
    return ensureVersions().then(function (vs) {
      fillVersions(vs);
      return rpc("admin_users", {
        p_q: state.q || null,
        p_version: state.version || null,
        p_sort: state.sort,
        p_asc: state.asc,
        p_offset: (state.page - 1) * PAGE,
        p_limit: PAGE
      });
    }).then(function (d) {
      var rows = d.rows || [];
      return '<section class="panel"><div class="table-wrap"><table><thead><tr>' +
          th("Riot adı", "riot_name") + th("Durum") + th("Sürüm", "app_version") + th("İlk görülme", "first_seen") + th("Son görülme", "last_seen") + th("PUUID") +
        "</tr></thead><tbody>" +
        (rows.length ? rows.map(function (r) {
          return "<tr" + rowAttrs(r.puuid, r.install_id) + ">" +
            "<td>" + nameCell(r.riot_name) + "</td>" +
            "<td>" + (r.live_phase ? pill(r.live_phase) : '<span class="muted">—</span>') + "</td>" +
            '<td class="mono">' + esc(r.app_version || "—") + "</td>" +
            '<td class="muted" title="' + esc(fmt(r.first_seen)) + '">' + esc(fmt(r.first_seen)) + "</td>" +
            '<td class="muted" title="' + esc(fmt(r.last_seen)) + '">' + esc(ago(r.last_seen)) + "</td>" +
            '<td class="mono muted">' + esc((r.puuid || "").slice(0, 8)) + "…</td></tr>";
        }).join("") : '<tr><td colspan="6"><div class="empty">Kayıt yok.</div></td></tr>') +
        "</tbody></table></div>" + pager(d.total || 0) + "</section>";
    });
  };

  loaders.sessions = function () {
    return ensureVersions().then(function (vs) {
      fillVersions(vs);
      return rpc("admin_sessions", {
        p_q: state.q || null,
        p_version: state.version || null,
        p_sort: state.sort,
        p_asc: state.asc,
        p_offset: (state.page - 1) * PAGE,
        p_limit: PAGE
      });
    }).then(function (d) {
      var rows = d.rows || [];
      return '<section class="panel"><div class="table-wrap"><table><thead><tr>' +
          th("Açılış", "started_at") + th("Oyuncu") + th("Sürüm") + th("Süre", "duration") +
        "</tr></thead><tbody>" +
        (rows.length ? rows.map(function (r) {
          return "<tr" + rowAttrs(r.puuid, r.install_id) + ">" +
            "<td>" + esc(fmt(r.started_at)) + "</td>" +
            "<td>" + nameCell(r.riot_name) + "</td>" +
            '<td class="mono">' + esc(r.app_version || "—") + "</td>" +
            "<td>" + esc(dur(r.duration)) + (r.live ? '<span class="badge-live">açık</span>' : "") + "</td></tr>";
        }).join("") : '<tr><td colspan="4"><div class="empty">Oturum yok.</div></td></tr>') +
        "</tbody></table></div>" + pager(d.total || 0) + "</section>";
    });
  };

  // ---------------- detay paneli ----------------

  var drawerSeq = 0;
  function kv(k, v) { return "<span>" + esc(k) + "</span><div>" + v + "</div>"; }

  function openDrawer(puuid, install) {
    var seq = ++drawerSeq;
    $("drawer-back").classList.add("on");
    $("drawer").classList.add("on");
    $("drawer").innerHTML = '<header><h3>Yükleniyor…</h3><button class="btn ghost small" id="close-drawer" type="button">Kapat</button></header>';
    $("close-drawer").onclick = closeDrawer;
    rpc("admin_detail", { p_puuid: puuid || null, p_install: install || null }).then(function (d) {
      if (seq !== drawerSeq) return;
      var u = d.user || {};
      var p = d.presence || null;
      var live = p && p.phase !== "closed" && Date.now() - new Date(p.last_seen).getTime() < 360000;
      var name = u.riot_name || (p && p.riot_name) || "İsimsiz";
      var id = u.puuid || puuid || "";
      var rows = kv("Durum", live ? pill(p.phase) : pill("closed"));
      if (live) {
        rows += kv("Ne yapıyor", esc(detail(p)));
        if (inMatch(p)) {
          rows += kv("Harita", esc(mapLabel(p) || "—"));
          rows += kv("Ajan", esc(p.agent || "—"));
          if (p.phase === "ingame") rows += kv("Skor", esc(scoreText(p) || "—"));
        }
        if (p.mode_name) rows += kv("Mod", esc(modeLabel(p.mode_name)));
        if (p.party_size) rows += kv("Parti", esc(p.party_size > 1 ? p.party_size + " kişi" : "Tek"));
      }
      rows += kv("Son sinyal", esc(p ? ago(p.last_seen) + " · " + fmt(p.last_seen) : "—"));
      rows += kv("Sürüm", esc((p && p.app_version) || u.app_version || "—"));
      rows += kv("Bölge", esc(((p && p.region) || "—").toUpperCase()));
      rows += kv("İlk görülme", esc(fmt(u.first_seen)));
      rows += kv("PUUID", id ? '<div class="mono">' + esc(id) + '</div><button class="copy" id="copy-id" type="button">Kopyala</button>' : "—");
      rows += kv("Kurulum", '<div class="mono">' + esc((p && p.install_id) || install || u.install_id || "—") + "</div>");

      var accounts = d.accounts || [];
      var sessions = d.sessions || [];
      $("drawer").innerHTML =
        '<header><h3>' + esc(name) + '</h3><button class="btn ghost small" id="close-drawer" type="button">Kapat</button></header>' +
        '<div class="kv">' + rows + "</div>" +
        (accounts.length > 1 ? '<section class="panel" style="margin:0 16px 16px"><h2>Bu kurulumdaki hesaplar</h2><table><tbody>' +
          accounts.map(function (a) {
            return "<tr><td>" + nameCell(a.riot_name) + '</td><td class="muted">' + esc(ago(a.last_seen)) + "</td></tr>";
          }).join("") + "</tbody></table></section>" : "") +
        '<section class="panel" style="margin:0 16px 16px"><h2>Son oturumlar</h2>' +
          (sessions.length ? "<table><tbody>" + sessions.map(function (s) {
            return "<tr><td>" + esc(fmt(s.started_at)) + "</td><td>" + esc(dur(s.duration)) + '</td><td class="mono">' + esc(s.app_version || "—") + "</td></tr>";
          }).join("") + "</tbody></table>" : '<div class="empty">Oturum yok.</div>') +
        "</section>";
      $("close-drawer").onclick = closeDrawer;
      var copy = $("copy-id");
      if (copy) copy.onclick = function () {
        navigator.clipboard.writeText(id).then(function () { copy.textContent = "Kopyalandı"; });
      };
    }).catch(function (e) {
      if (seq !== drawerSeq) return;
      $("drawer").innerHTML = '<header><h3>Hata</h3><button class="btn ghost small" id="close-drawer" type="button">Kapat</button></header>' +
        '<div class="kv"><div class="notice" style="grid-column:1/-1">' + esc(errText(e)) + "</div></div>";
      $("close-drawer").onclick = closeDrawer;
    });
  }

  function closeDrawer() {
    drawerSeq++;
    $("drawer").classList.remove("on");
    $("drawer-back").classList.remove("on");
  }

  // ---------------- olaylar ----------------

  $("nav").onclick = function (e) {
    var b = e.target.closest("button");
    if (b) go(b.getAttribute("data-route"));
  };
  $("menu").onclick = function () { $("rail").classList.toggle("open"); };
  $("refresh").onclick = function () { load(); };
  $("drawer-back").onclick = closeDrawer;
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
  $("global-search").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    state.q = e.target.value.trim();
    state.page = 1;
    if (state.route === "overview") go("users");
    else { var q = $("local-q"); if (q) q.value = state.q; load(); }
  });
  $("signout").onclick = function () { sb.auth.signOut(); };
  $("signin").onsubmit = function (e) {
    e.preventDefault();
    $("login-error").textContent = "";
    $("signin-btn").disabled = true;
    sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    }).then(function (res) {
      if (res.error) $("login-error").textContent = res.error.message;
    }).finally(function () { $("signin-btn").disabled = false; });
  };

  function showApp(user) {
    if (state.user && state.user.id === user.id) return;
    state.user = user;
    $("login-screen").style.display = "none";
    $("app").classList.add("on");
    $("who").textContent = user.email || "";
    enter(routeFromHash());
  }

  function showLogin() {
    state.user = null;
    state.route = null;
    clearTimeout(state.timer);
    $("app").classList.remove("on");
    $("login-screen").style.display = "grid";
    closeDrawer();
  }

  sb.auth.onAuthStateChange(function (_e, session) {
    if (session && session.user) showApp(session.user);
    else showLogin();
  });
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) showApp(res.data.session.user);
    else showLogin();
  });
})();
</script>
</body>
</html>
